<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>AI Pothole Detection</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="background"></div>

    <section class="auth-screen" id="authScreen">
        <div class="cloud-overlay"></div>
        <div class="auth-shell">
            <div class="auth-card">
                <div class="auth-card-head">
                    <p class="auth-kicker">Welcome back</p>
                    <h2>Sign in to continue</h2>
                    <p class="auth-card-copy">Enter email and password to login .</p>
                </div>

                <div class="auth-tabs" role="tablist" aria-label="Authentication options">
                    <button class="auth-tab active" data-auth-tab="signin" type="button">Sign In</button>
                    <button class="auth-tab" data-auth-tab="signup" type="button">Sign Up</button>
                </div>

                <div class="auth-alert hidden" id="authAlert" role="alert"></div>

                <form class="auth-form active" id="signinForm">
                    <div class="social-row">
                        <button type="button" class="social-btn" data-social="google" aria-label="Continue with Google"><i class="fa-brands fa-google"></i></button>
                        <button type="button" class="social-btn" data-social="facebook" aria-label="Continue with Facebook"><i class="fa-brands fa-facebook-f"></i></button>
                        <button type="button" class="social-btn" data-social="linkedin" aria-label="Continue with LinkedIn"><i class="fa-brands fa-linkedin-in"></i></button>
                        <button type="button" class="social-btn" data-social="github" aria-label="Continue with GitHub"><i class="fa-brands fa-github"></i></button>
                    </div>

                    <div class="auth-divider"><span>OR</span></div>

                    <label>
                        E-Mail Address
                        <input type="text" id="signinEmail" placeholder="Enter any email or username..." required>
                    </label>
                    <label>
                        Password
                        <input type="password" id="signinPassword" placeholder="Password@123" required>
                    </label>
                    <div class="auth-inline-row">
                        <label class="check-row"><input type="checkbox" id="rememberMe"> Remember me</label>
                        <button type="button" class="text-btn">Forgot password?</button>
                    </div>
                    <button type="submit" class="auth-submit">Sign In</button>
                    <p class="auth-hint">Dont have an account yet? Use the Sign Up tab.</p>
                </form>

                <form class="auth-form" id="signupForm">
                    <div class="social-row">
                        <button type="button" class="social-btn" data-social="google" aria-label="Sign up with Google"><i class="fa-brands fa-google"></i></button>
                        <button type="button" class="social-btn" data-social="facebook" aria-label="Sign up with Facebook"><i class="fa-brands fa-facebook-f"></i></button>
                        <button type="button" class="social-btn" data-social="linkedin" aria-label="Sign up with LinkedIn"><i class="fa-brands fa-linkedin-in"></i></button>
                        <button type="button" class="social-btn" data-social="github" aria-label="Sign up with GitHub"><i class="fa-brands fa-github"></i></button>
                    </div>

                    <div class="auth-divider"><span>OR</span></div>

                    <label>
                        Full Name
                        <input type="text" id="signupName" placeholder="Your name" required>
                    </label>
                    <label>
                        E-Mail Address
                        <input type="email" id="signupEmail" placeholder="you@example.com" required>
                    </label>
                    <label>
                        Password
                        <input type="password" id="signupPassword" placeholder="Create your password" required>
                    </label>
                    <button type="submit" class="auth-submit">Create Account</button>
                    <p class="auth-hint">Social sign up buttons above are available as quick entry options.</p>
                </form>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
